# 用发布的镜像：docker compose up -d
# 从源码构建（在仓库根目录）：docker compose up -d --build
#
# 先把 deploy/env.example 复制成和本文件同目录的 .env，至少填上 AGY2API_ADMIN_PASSWORD（.env 不入库）。
# 默认只在本机 8249 监听，由同机的反向代理（Caddy、nginx）对外提供 HTTPS，见 docs/deploy.md。
services:
  agy2api:
    # 默认用 ghcr.io 上最新的正式版；固定版本在 .env 里写 AGY2API_IMAGE=ghcr.io/shiceai/agy2api:1.2.0。
    # 从源码构建时，构建出的镜像也用这个名字，之后要换回发布的镜像执行 docker compose pull。
    image: ${AGY2API_IMAGE:-ghcr.io/shiceai/agy2api:latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    # 默认只在本机 8249 监听；要直接对外（不经反代），在 .env 里写 AGY2API_BIND=0.0.0.0:8249。
    ports:
      - "${AGY2API_BIND:-127.0.0.1:8249}:8249"
    volumes:
      - data:/data
    # 关停时先等进行中的请求（最多 10 秒），再写完排队的用量记录（最多 5 秒）；默认 10 秒不够。
    stop_grace_period: 30s

volumes:
  # 命名卷：库和加密密钥都在里面，要一起备份。
  data:
