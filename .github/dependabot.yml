# Dependabot：每周检查一次依赖更新并开 PR，由 CI 检查。新版本发布满 3 天才提，避开发布后很快撤回的版本
# （pnpm 也会拦截刚发布的版本）；同一类依赖的小版本和补丁合成一个 PR，大版本单独提。前端和镜像的大版本
# （TypeScript、vue-tsc、Vite 插件、Node 等）要和工具链、CI 一起改，不自动提，专门安排升级。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)
